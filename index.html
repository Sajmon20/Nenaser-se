<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Obléhání pravdy</title>
<style>
:root{--bg:#0b1026;--bg2:#2a1b4d;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--tx:#eef0ff;--mut:#a2abd6;--ac:#ffcf5a;--atk:#ff7a5c;--def:#4fd1c5;--inp:rgba(0,0,0,.28)}
:root[data-theme=light]{--bg:#eef0fb;--bg2:#e3d9f3;--card:rgba(255,255,255,.85);--line:rgba(30,35,80,.14);--tx:#1b2040;--mut:#5d648c;--inp:rgba(255,255,255,.9)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font:16px/1.5 system-ui,-apple-system,sans-serif;background:radial-gradient(120% 80% at 50% 0,var(--bg2),var(--bg) 70%) fixed}
main{max-width:640px;margin:0 auto;padding:22px 16px 56px}
h1{font:800 clamp(2.3rem,9vw,3.5rem)/1.02 Georgia,serif;letter-spacing:-.02em;margin:18px 0 6px}
h2{font:700 1.5rem Georgia,serif;margin:0 0 10px}
.sub{color:var(--mut);margin:0 0 22px;max-width:46ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;backdrop-filter:blur(8px)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px 18px;transition:transform .12s,border-color .12s}
button:hover:not(:disabled){border-color:var(--ac);transform:translateY(-1px)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
.main{background:var(--ac);color:#25190a;border-color:var(--ac);font-weight:700}
.menu{display:grid;gap:12px}
.menu button{padding:18px 20px;font-size:1.15rem;text-align:left}
input,select{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--inp);margin:6px 0 16px}
select option{color:#111}
label{font-size:.92rem;color:var(--mut)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.back{background:none;border:none;color:var(--mut);padding:4px 0 10px}
.scene{display:block;width:100%;height:auto;border-radius:20px;border:1px solid var(--line)}
.code{font:800 2.8rem Georgia,serif;letter-spacing:.28em;color:var(--ac)}
.q{font:1.4rem/1.35 Georgia,serif;margin:6px 0 18px}
.turn.A{border-left:4px solid var(--atk)}.turn.D{border-left:4px solid var(--def)}
.msg{color:var(--mut);margin:10px 0}
.pill{font-size:.88rem;color:var(--mut)}
.ov{position:fixed;inset:0;background:rgba(5,8,24,.7);display:grid;place-items:center;padding:16px;z-index:5}
.modal{width:100%;max-width:380px;background:var(--bg2)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" role="status"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,set,get,update,remove,onValue} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyC-CIV9FpMHy67izoGPxYxUVlI-ZWB4Wi0",
  authDomain: "nenaser-se.firebaseapp.com",
  databaseURL: "https://nenaser-se-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "nenaser-se",
  appId: "1:771972269804:web:333862bd4a0e9ed48e07c9"
};

/* Zástupné otázky – t = tvrzení, a = pravda (true) / lež (false), e = vysvětlení */
const Q = [
  {t:"Velká čínská zeď je viditelná pouhým okem z Měsíce.",a:false,e:"Z Měsíce není vidět, je příliš úzká."},
  {t:"Voda se při zamrznutí rozpíná.",a:true,e:"Led má větší objem než voda."},
  {t:"Netopýři jsou slepí.",a:false,e:"Vidí, mnozí dobře, a navíc používají echolokaci."},
  {t:"Blesk nikdy neudeří dvakrát do stejného místa.",a:false,e:"Do vysokých budov udeří i několikrát za rok."},
  {t:"Praha leží na řece Vltavě.",a:true,e:"Vltava protéká centrem Prahy."}
];
const WIN = 10, MAX_TURNS = 24;

const db = getDatabase(initializeApp(FIREBASE_CONFIG));
const S = JSON.parse(localStorage.getItem("hra") || "{}");
S.id = S.id || Math.random().toString(36).slice(2, 10);
S.name = S.name || ""; S.theme = S.theme || "dark";
const save = () => localStorage.setItem("hra", JSON.stringify(S));
const applyTheme = () => document.documentElement.dataset.theme = S.theme;
save(); applyTheme();

const $ = s => document.querySelector(s), app = $("#app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rnd = () => Math.floor(Math.random() * Q.length);
const roleName = r => r === "A" ? "Útočník" : "Obránce";
let unsub = null, room = null, code = null, modalRes = null;
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2600)}
const stop = () => { if(unsub){unsub();unsub=null} };

/* ---------- Ilustrace: cesta, hrad a figurky ---------- */
const PT = i => ({x:44+i*42, y:176+9*Math.sin(i*.9)});
const tf = i => { const p = PT(i); return `translate(${p.x}px,${p.y-4}px)`; };
const mer = (x,y,n) => Array.from({length:n},(_,i)=>`<rect x="${x+i*12}" y="${y}" width="7" height="8" fill="#6a6f9c"/>`).join("");
const pawn = (c,t,id,extra) => `<g ${id?`id="${id}"`:""} style="transform:${t};transition:transform .8s cubic-bezier(.3,1.35,.5,1)"><ellipse cy="2" rx="11" ry="3" fill="#0007"/><path d="M-9 0Q-9 -17 0 -19Q9 -17 9 0Z" fill="${c}"/><circle cy="-27" r="8" fill="${c}" stroke="#fff8" stroke-width="1.5"/>${extra}</g>`;
function scene(p, live){
  let stones = ""; for(let i=0;i<=WIN;i++){const q=PT(i);stones+=`<ellipse cx="${q.x}" cy="${q.y}" rx="11" ry="4.5" fill="${i===WIN?"#ffcf5a":"#c9b78d"}" opacity=".85"/>`}
  const stars = [[200,30],[260,62],[330,24],[420,50],[520,20],[600,54],[150,72]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="1.5" fill="#fff" opacity=".8"/>`).join("");
  return `<svg viewBox="0 0 640 240" class="scene" role="img" aria-label="Cesta k hradu">
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1030"/><stop offset=".65" stop-color="#4b2c6e"/><stop offset="1" stop-color="#e98a5c"/></linearGradient></defs>
  <rect width="640" height="240" fill="url(#sky)"/>${stars}<circle cx="80" cy="46" r="20" fill="#fff3cf"/>
  <path d="M0 190Q130 140 270 182T640 160V240H0Z" fill="#241d4d"/><path d="M0 215Q170 185 330 208T640 198V240H0Z" fill="#161233"/>
  ${stones}
  <rect x="498" y="112" width="116" height="92" fill="#575c8a"/>${mer(522,104,6)}
  <rect x="482" y="70" width="36" height="134" fill="#6a6f9c"/><rect x="594" y="70" width="36" height="134" fill="#6a6f9c"/>
  <path d="M478 70L500 36L522 70Z" fill="#c8453b"/><path d="M590 70L612 36L634 70Z" fill="#c8453b"/>
  <path d="M500 36V18l14 5-14 5" fill="#ffcf5a"/><path d="M612 36V18l14 5-14 5" fill="#ffcf5a"/>
  <rect x="497" y="100" width="6" height="12" rx="3" fill="#ffcf5a"/><rect x="609" y="100" width="6" height="12" rx="3" fill="#ffcf5a"/>
  <path d="M536 204V172Q556 146 576 172V204Z" fill="#120d24"/><circle cx="556" cy="184" r="4" fill="#ffcf5a" opacity=".85"/>
  ${pawn("#4fd1c5","translate(556px,112px)","", '<path d="M-17 -16h11v11q-5.5 5-11 0z" fill="#fff" opacity=".9"/>')}
  ${pawn("#ff7a5c",tf(p),live?"pawn":"", '<path d="M13 -6L13 -32" stroke="#fff" stroke-width="3" stroke-linecap="round"/>')}
  </svg>`;
}

/* ---------- Okno s přezdívkou ---------- */
function askName(){
  return new Promise(res => {
    modalRes = res;
    const d = document.createElement("div"); d.className = "ov"; d.id = "modal";
    d.innerHTML = `<div class="card modal" role="dialog" aria-label="Přezdívka"><h2>Jak ti říkat?</h2>
      <label for="mn">Přezdívka uvidí soupeř</label><input id="mn" maxlength="16" value="${esc(S.name)}" autocomplete="off">
      <div class="grid2"><button data-act="mcancel">Zrušit</button><button class="main" data-act="mok">Pokračovat</button></div></div>`;
    document.body.appendChild(d); $("#mn").focus();
  });
}
function closeModal(v){ const m = $("#modal"); if(m) m.remove(); if(modalRes){ modalRes(v); modalRes = null; } }

/* ---------- Obrazovky ---------- */
function menu(){
  stop(); room = null; code = null;
  app.innerHTML = `${scene(0,false)}
    <h1>Obléhání pravdy</h1>
    <p class="sub">Souboj dvou hráčů o hrad. Kdo pozná pravdu, ten postupuje. Kdo se splete, stojí na místě.</p>
    <div class="menu">
      <button class="main" data-act="find">⚔️ Najít hru</button>
      <button data-act="create">🏰 Vytvořit hru</button>
      <button data-act="settings">⚙️ Nastavení</button>
    </div>`;
}
function find(){
  app.innerHTML = `<button class="back" data-act="menu">← Zpět do menu</button>
    <h2>Najít hru</h2>
    <div class="card"><label for="jc">Mám kód od kamaráda</label>
      <div class="row"><input id="jc" maxlength="4" placeholder="ABCD" style="margin:0;text-transform:uppercase">
      <button class="main" data-act="joincode">Připojit se</button></div></div>
    <h2 style="margin-top:26px">Veřejné hry</h2><div id="list"><p class="pill">Načítám…</p></div>`;
  stop();
  unsub = onValue(ref(db, "rooms"), s => {
    const v = s.val() || {}, el = $("#list"); if(!el) return;
    const open = Object.entries(v).filter(([,r]) => r.status === "lobby" && r.public !== false && Object.keys(r.players||{}).length < 2);
    el.innerHTML = open.length ? open.map(([c,r]) => `
      <div class="card row"><div><strong>${esc(r.name)}</strong><div class="pill">1v1 · hostitel ${esc(Object.values(r.players)[0].name)}</div></div>
      <button class="main" data-act="join" data-code="${c}">Hrát</button></div>`).join("")
      : '<div class="card pill">Žádná veřejná hra zrovna nečeká. Vytvoř vlastní a pozvi někoho kódem.</div>';
  });
}
function create(){
  app.innerHTML = `<button class="back" data-act="menu">← Zpět do menu</button>
    <h2>Vytvořit hru</h2>
    <div class="card"><label for="rn">Název hry</label><input id="rn" maxlength="30" placeholder="Např. Souboj o hrad">
    <label for="rv">Kdo se může připojit</label>
    <select id="rv"><option value="1">Veřejná: zobrazí se v seznamu her</option><option value="0">Soukromá: jen přes kód</option></select>
    <label for="rm">Režim</label>
    <select id="rm"><option>1v1 hrad (útočník proti obránci)</option>
      <option disabled>Týmy (brzy)</option><option disabled>Každý sám za sebe (brzy)</option><option disabled>Přežití (brzy)</option></select>
    <button class="main" data-act="docreate" style="width:100%">Vytvořit hru</button></div>`;
}
function settings(){
  app.innerHTML = `<button class="back" data-act="menu">← Zpět do menu</button>
    <h2>Nastavení</h2>
    <div class="card"><label for="th">Vzhled</label>
    <select id="th" style="margin-bottom:0"><option value="dark">Tmavý (noc nad hradem)</option><option value="light">Světlý (den)</option></select></div>`;
  $("#th").value = S.theme;
}

/* ---------- Firebase logika ---------- */
async function createRoom(name, rname, isPublic){
  S.name = name; save();
  const L = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  const c = Array.from({length:4}, () => L[Math.random()*L.length|0]).join("");
  await set(ref(db, "rooms/" + c), {name: rname || "Hra " + c, public: isPublic, status:"lobby", host:S.id, created:Date.now(),
    players:{[S.id]:{name, role:"A"}}});
  enter(c);
}
async function joinRoom(c, name){
  c = (c||"").toUpperCase().trim(); S.name = name; save();
  const s = await get(ref(db, "rooms/" + c));
  if(!s.exists()) return toast("Hra s tímto kódem neexistuje");
  const v = s.val();
  if(v.players && v.players[S.id]) return enter(c);
  if(v.status !== "lobby" || Object.keys(v.players).length >= 2) return toast("Hra je plná nebo už běží");
  await update(ref(db, `rooms/${c}/players/${S.id}`), {name, role:"D"});
  enter(c);
}
function enter(c){
  stop(); code = c;
  unsub = onValue(ref(db, "rooms/" + c), s => {
    room = s.val();
    if(!room){ menu(); toast("Hra skončila nebo byla zrušena"); return; }
    drawRoom();
  });
}
const R = () => ref(db, "rooms/" + code);
const myRole = () => room.players[S.id]?.role;
function startGame(){
  update(R(), {status:"playing", turn:"A", phase:"answer", pos:0, tc:0, qi:rnd(), chA:0, chD:0, msg:"Hra začíná. Útočník je na tahu."});
}
function endTurn(patch){
  const tc = room.tc + 1, pos = patch.pos ?? room.pos, u = {...patch, tc};
  if(pos >= WIN){ u.status = "finished"; u.winner = "A"; }
  else if(tc >= MAX_TURNS){ u.status = "finished"; u.winner = "D"; }
  else { u.turn = room.turn === "A" ? "D" : "A"; u.phase = "answer"; u.qi = rnd(); }
  update(R(), u);
}
function answer(v){
  const q = Q[room.qi];
  if(v === q.a) update(R(), {phase:"choose", msg:"✅ Správně! " + q.e});
  else endTurn({msg:"❌ Špatně. " + q.e});
}
function choose(k){
  const r = myRole(); let pos = room.pos, ch = room["ch"+r] || 0, d = 0, m;
  if(k === "step"){ d = 1; m = r==="A" ? "Útočník postupuje o 1 pole." : "Obránce odhazuje útočníka o 1 pole."; }
  if(k === "charge"){ ch++; m = roleName(r) + " nabíjí sílu (" + ch + "/2)."; }
  if(k === "power"){ ch -= 2; d = 3; m = r==="A" ? "Útočník používá žebřík: +3 pole!" : "Obránce spouští katapult: −3 pole!"; }
  pos = r === "A" ? Math.min(WIN, pos + d) : Math.max(0, pos - d);
  endTurn({pos, ["ch"+r]:ch, msg:m});
}
async function leave(){
  if(room && code){
    if(room.host === S.id || room.status !== "lobby") await remove(R());
    else await remove(ref(db, `rooms/${code}/players/${S.id}`));
  }
  menu();
}

/* ---------- Vykreslení hry ---------- */
function drawRoom(){
  const ps = Object.entries(room.players), me = myRole();
  const head = `<button class="back" data-act="leave">← Opustit hru</button>`;
  if(room.status === "lobby"){
    app.innerHTML = head + `<h2>${esc(room.name)}</h2>
      <p class="sub">${room.public === false ? "Soukromá hra. Pošli kamarádovi tento kód." : "Veřejná hra. Soupeř ji najde v seznamu, nebo mu pošli kód."}</p>
      <div class="card"><div class="code">${code}</div></div>
      <div class="card">${ps.map(([,p]) => `<div class="row"><span>${esc(p.name)}</span><span class="pill">${roleName(p.role)}</span></div>`).join("")}
      ${ps.length < 2 ? '<p class="pill" style="margin-bottom:0">Čekám na soupeře…</p>' : ""}</div>
      ${room.host === S.id ? `<button class="main" data-act="start" style="width:100%" ${ps.length<2?"disabled":""}>Spustit hru</button>` : '<p class="pill">Hostitel spustí hru.</p>'}`;
    return;
  }
  if(room.status === "finished"){
    const won = room.winner === me;
    app.innerHTML = head + scene(room.pos,false) + `<h1>${won ? "Vyhráváš!" : "Tentokrát ne"}</h1>
      <p class="sub">${room.winner==="A" ? "Útočník dobyl hrad." : "Obránce ubránil hrad."}</p>
      <button class="main" data-act="leave" style="width:100%">Zpět do menu</button>`;
    return;
  }
  if(!$("#panel")) app.innerHTML = head + `<div class="row" style="margin-bottom:10px"><span class="pill" id="top"></span></div>${scene(room.pos,true)}<div id="panel"></div>`;
  $("#top").textContent = `Jsi ${roleName(me).toLowerCase()} · tah ${room.tc+1} z ${MAX_TURNS} · pole ${room.pos}/${WIN}`;
  $("#pawn").style.transform = tf(room.pos);
  const mine = room.turn === me, q = Q[room.qi], ch = room["ch"+me] || 0; let act;
  if(room.phase === "answer"){
    act = mine ? `<div class="grid2"><button class="main" data-act="ans" data-v="1">Pravda</button><button data-act="ans" data-v="0">Lež</button></div>`
      : `<p class="pill">${roleName(room.turn)} přemýšlí…</p>`;
  } else {
    act = mine ? `<p><strong>Správně. Co teď?</strong></p><div class="menu">
      <button class="main" data-act="ch" data-k="step">${me==="A"?"Postoupit o 1 pole":"Odhodit útočníka o 1 pole"}</button>
      <button data-act="ch" data-k="charge">Nabít sílu (máš ${ch}/2)</button>
      <button data-act="ch" data-k="power" ${ch<2?"disabled":""}>${me==="A"?"Žebřík: +3 pole":"Katapult: −3 pole"} (2 nabití)</button></div>`
      : `<p class="pill">${roleName(room.turn)} vybírá odměnu…</p>`;
  }
  $("#panel").innerHTML = `<div class="card turn ${room.turn}"><div class="pill">${roleName(room.turn)} na tahu${mine?" (ty)":""}</div><div class="q">${esc(q.t)}</div>${act}</div>
    <p class="msg">${esc(room.msg || "")}</p><div class="pill">⚡ Útočník ${room.chA||0}/2 · Obránce ${room.chD||0}/2</div>`;
}

/* ---------- Události ---------- */
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a === "menu") menu();
  else if(a === "find") find();
  else if(a === "create") create();
  else if(a === "settings") settings();
  else if(a === "mok"){ const n = $("#mn").value.trim(); if(!n) return toast("Napiš přezdívku"); closeModal(n); }
  else if(a === "mcancel") closeModal(null);
  else if(a === "join"){ const n = await askName(); if(n) joinRoom(b.dataset.code, n); }
  else if(a === "joincode"){ const c = $("#jc").value.trim(); if(c.length < 4) return toast("Kód má 4 písmena"); const n = await askName(); if(n) joinRoom(c, n); }
  else if(a === "docreate"){ const rn = $("#rn").value.trim(), pub = $("#rv").value === "1"; const n = await askName(); if(n) createRoom(n, rn, pub); }
  else if(a === "start") startGame();
  else if(a === "ans") answer(b.dataset.v === "1");
  else if(a === "ch") choose(b.dataset.k);
  else if(a === "leave") leave();
});
document.addEventListener("change", e => { if(e.target.id === "th"){ S.theme = e.target.value; save(); applyTheme(); } });
document.addEventListener("keydown", e => { if(e.key === "Enter" && $("#mn")) $('[data-act="mok"]').click(); });

menu();
</script>
</body>
</html>
