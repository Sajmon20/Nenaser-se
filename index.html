<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hradby pravdy</title>
<style>
:root{--bg:#1d2740;--card:#2a3558;--line:#3d4a75;--tx:#f1eee6;--mut:#a7b0d0;--ac:#f08a24;--ok:#7bc47f;--bad:#e5645e}
:root[data-theme=light]{--bg:#ece7da;--card:#fffdf7;--line:#cfc7b2;--tx:#232a40;--mut:#6a6f86}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif}
main{max-width:620px;margin:0 auto;padding:24px 16px 48px}
h1,h2{font-family:Georgia,serif;margin:0 0 8px}
h1{font-size:2.4rem;line-height:1.1}
.sub{color:var(--mut);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:12px 16px}
button:hover:not(:disabled){border-color:var(--ac)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.main{background:var(--ac);color:#1b1206;border-color:var(--ac);font-weight:700}
.menu{display:grid;gap:12px}
.menu button{padding:18px;font-size:1.15rem;text-align:left}
input,select{width:100%;padding:11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);margin:4px 0 14px}
label{font-size:.9rem;color:var(--mut)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.back{background:none;border:none;color:var(--mut);padding:0 0 16px}
.code{font:700 2.6rem Georgia,serif;letter-spacing:.25em}
.track{display:flex;gap:3px;margin:16px 0}
.cell{flex:1;aspect-ratio:1;display:grid;place-items:center;border-radius:6px;background:var(--bg);border:1px solid var(--line);font-size:1rem}
.cell.on{background:var(--ac);border-color:var(--ac)}
.q{font:1.35rem/1.35 Georgia,serif;margin:6px 0 16px}
.msg{color:var(--mut);margin-top:10px}
.pill{font-size:.85rem;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" role="status"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,set,get,update,remove,onValue} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* 1) SEM VLOŽ SVOJI FIREBASE KONFIGURACI (Project settings → Your apps → Web) */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyC-CIV9FpMHy67izoGPxYxUVlI-ZWB4Wi0",
  authDomain: "nenaser-se.firebaseapp.com",
  databaseURL: "https://nenaser-se-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "nenaser-se",
  appId: "1:771972269804:web:333862bd4a0e9ed48e07c9"
};

/* 2) PLACEHOLDER OTÁZKY – nahradíme vlastní databází. t = tvrzení, a = true (pravda) / false (lež), e = vysvětlení */
const Q = [
  {t:"Velká čínská zeď je viditelná pouhým okem z Měsíce.",a:false,e:"Z Měsíce není vidět, je příliš úzká."},
  {t:"Voda se při zamrznutí rozpíná.",a:true,e:"Led má větší objem než voda."},
  {t:"Netopýři jsou slepí.",a:false,e:"Vidí, mnozí dobře, a navíc používají echolokaci."},
  {t:"Blesk nikdy neudeří dvakrát do stejného místa.",a:false,e:"Do vysokých budov udeří i několikrát za rok."},
  {t:"Praha leží na řece Vltavě.",a:true,e:"Vltava protéká centrem Prahy."}
];
const WIN = 10, MAX_TURNS = 24;

const ok = !!FIREBASE_CONFIG.databaseURL;
const db = ok ? getDatabase(initializeApp(FIREBASE_CONFIG)) : null;

const S = JSON.parse(localStorage.getItem("hra") || "{}");
S.id = S.id || Math.random().toString(36).slice(2, 10);
S.name = S.name || "";
S.theme = S.theme || "dark";
const save = () => localStorage.setItem("hra", JSON.stringify(S));
const applyTheme = () => document.documentElement.dataset.theme = S.theme;
save(); applyTheme();

const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rnd = () => Math.floor(Math.random() * Q.length);
const roleName = r => r === "A" ? "Útočník" : "Obránce";
let unsub = null, room = null, code = null;

function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2600)}
function needDb(){ if(ok) return true; toast("Nejdřív doplň Firebase konfiguraci v index.html"); return false; }
function needName(){ if(S.name) return true; toast("Nejdřív si v nastavení zadej přezdívku"); settings(); return false; }
const stop = () => { if(unsub){unsub();unsub=null} };

/* ---------- Obrazovky ---------- */
function menu(){
  stop(); room = null; code = null;
  app.innerHTML = `
    <h1>Hradby pravdy</h1>
    <p class="sub">Odpovídej správně, prorazíš k hradu. Nebo ho ubráníš.${S.name ? " Hraješ jako " + esc(S.name) + "." : ""}</p>
    <div class="menu">
      <button class="main" data-act="find">Najít hru</button>
      <button data-act="create">Vytvořit hru</button>
      <button data-act="settings">Nastavení</button>
    </div>
    ${ok ? "" : '<div class="card pill">Firebase zatím není nastavený. Menu funguje, hraní až po doplnění konfigurace v index.html.</div>'}`;
}

function find(){
  if(!needDb() || !needName()) return;
  app.innerHTML = `<button class="back" data-act="menu">← Zpět do menu</button>
    <h2>Najít hru</h2>
    <div class="card"><label for="jc">Mám kód od kamaráda</label>
      <div class="row"><input id="jc" maxlength="4" placeholder="ABCD" style="margin:0;text-transform:uppercase">
      <button class="main" data-act="joincode">Připojit se</button></div></div>
    <h2 style="margin-top:24px">Otevřené hry</h2><div id="list"><p class="pill">Načítám…</p></div>`;
  stop();
  unsub = onValue(ref(db, "rooms"), s => {
    const v = s.val() || {}, el = $("#list"); if(!el) return;
    const open = Object.entries(v).filter(([,r]) => r.status === "lobby" && Object.keys(r.players||{}).length < 2);
    el.innerHTML = open.length ? open.map(([c,r]) => `
      <div class="card row"><div><strong>${esc(r.name)}</strong><div class="pill">Režim 1v1 · hostitel ${esc(Object.values(r.players)[0].name)}</div></div>
      <button class="main" data-act="join" data-code="${c}">Hrát</button></div>`).join("")
      : '<div class="card pill">Nikdo zatím nehraje. Vytvoř vlastní hru a pošli kód kamarádovi.</div>';
  });
}

function create(){
  if(!needDb() || !needName()) return;
  app.innerHTML = `<button class="back" data-act="menu">← Zpět do menu</button>
    <h2>Vytvořit hru</h2>
    <div class="card"><label for="rn">Název hry</label><input id="rn" maxlength="30" placeholder="Např. Souboj o hrad">
    <label for="rm">Režim</label>
    <select id="rm"><option>1v1 hrad (útočník proti obránci)</option>
      <option disabled>Týmy (brzy)</option><option disabled>Každý sám za sebe (brzy)</option><option disabled>Přežití (brzy)</option></select>
    <button class="main" data-act="docreate" style="width:100%">Vytvořit a čekat na soupeře</button></div>`;
}

function settings(){
  app.innerHTML = `<button class="back" data-act="menu">← Zpět do menu</button>
    <h2>Nastavení</h2>
    <div class="card"><label for="nm">Přezdívka</label><input id="nm" maxlength="16" value="${esc(S.name)}" placeholder="Jak se jmenuješ?">
    <label for="th">Vzhled</label><select id="th"><option value="dark">Tmavý (soumrak)</option><option value="light">Světlý (pergamen)</option></select>
    <button class="main" data-act="savesettings" style="width:100%">Uložit nastavení</button></div>`;
  $("#th").value = S.theme;
}

/* ---------- Firebase logika ---------- */
async function createRoom(name){
  const L = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  const c = Array.from({length:4}, () => L[Math.random()*L.length|0]).join("");
  await set(ref(db, "rooms/" + c), {name: name || "Hra " + c, status:"lobby", host:S.id, created:Date.now(),
    players:{[S.id]:{name:S.name, role:"A"}}});
  enter(c);
}
async function joinRoom(c){
  c = (c||"").toUpperCase().trim();
  const s = await get(ref(db, "rooms/" + c));
  if(!s.exists()) return toast("Hra s tímto kódem neexistuje");
  const v = s.val();
  if(v.players && v.players[S.id]) return enter(c);
  if(v.status !== "lobby" || Object.keys(v.players).length >= 2) return toast("Hra je plná nebo už běží");
  await update(ref(db, `rooms/${c}/players/${S.id}`), {name:S.name, role:"D"});
  enter(c);
}
function enter(c){
  stop(); code = c;
  unsub = onValue(ref(db, "rooms/" + c), s => {
    room = s.val();
    if(!room){ menu(); toast("Hra skončila nebo byla zrušena"); return; }
    drawRoom();
  });
}
const R = () => ref(db, "rooms/" + code);
const myRole = () => room.players[S.id]?.role;

function startGame(){
  update(R(), {status:"playing", turn:"A", phase:"answer", pos:0, tc:0, qi:rnd(), chA:0, chD:0,
    msg:"Hra začíná. Útočník je na tahu."});
}
function endTurn(patch){
  const tc = room.tc + 1, pos = patch.pos ?? room.pos, u = {...patch, tc};
  if(pos >= WIN){ u.status = "finished"; u.winner = "A"; }
  else if(tc >= MAX_TURNS){ u.status = "finished"; u.winner = "D"; }
  else { u.turn = room.turn === "A" ? "D" : "A"; u.phase = "answer"; u.qi = rnd(); }
  update(R(), u);
}
function answer(v){
  const q = Q[room.qi];
  if(v === q.a) update(R(), {phase:"choose", msg:"✅ Správně! " + q.e});
  else endTurn({msg:"❌ Špatně. " + q.e});
}
function choose(k){
  const r = myRole(); let pos = room.pos, ch = room["ch"+r] || 0, d = 0, m;
  if(k === "step"){ d = 1; m = r==="A" ? "Útočník postupuje o 1 pole." : "Obránce odhazuje útočníka o 1 pole."; }
  if(k === "charge"){ ch++; m = roleName(r) + " nabíjí sílu (" + ch + "/2)."; }
  if(k === "power"){ ch -= 2; d = 3; m = r==="A" ? "Útočník používá žebřík: +3 pole!" : "Obránce spouští katapult: −3 pole!"; }
  pos = r === "A" ? Math.min(WIN, pos + d) : Math.max(0, pos - d);
  endTurn({pos, ["ch"+r]:ch, msg:m});
}
async function leave(){
  if(room && code){
    if(room.host === S.id || room.status !== "lobby") await remove(R());
    else await remove(ref(db, `rooms/${code}/players/${S.id}`));
  }
  menu();
}

/* ---------- Vykreslení hry ---------- */
function drawRoom(){
  const ps = Object.entries(room.players), me = myRole();
  const head = `<button class="back" data-act="leave">← Opustit hru</button>`;

  if(room.status === "lobby"){
    app.innerHTML = head + `<h2>${esc(room.name)}</h2><p class="sub">Pošli kamarádovi tento kód, nebo ať hru najde v seznamu.</p>
      <div class="card"><div class="code">${code}</div></div>
      <div class="card">${ps.map(([,p]) => `<div class="row"><span>${esc(p.name)}</span><span class="pill">${roleName(p.role)}</span></div>`).join("")}
      ${ps.length < 2 ? '<p class="pill">Čekám na soupeře…</p>' : ""}</div>
      ${room.host === S.id ? `<button class="main" data-act="start" style="width:100%" ${ps.length<2?"disabled":""}>Spustit hru</button>` : '<p class="pill">Hostitel spustí hru.</p>'}`;
    return;
  }
  if(room.status === "finished"){
    const won = room.winner === me;
    app.innerHTML = head + `<h1>${won ? "Vyhráváš!" : "Tentokrát ne"}</h1>
      <p class="sub">${room.winner==="A" ? "Útočník dobyl hrad." : "Obránce ubránil hrad."}</p>
      <button class="main" data-act="leave" style="width:100%">Zpět do menu</button>`;
    return;
  }
  const mine = room.turn === me, q = Q[room.qi];
  const cells = Array.from({length:WIN+1}, (_,i) => `<div class="cell ${i===room.pos?"on":""}">${i===WIN?"🏰":i===room.pos?"🗡️":""}</div>`).join("");
  let action;
  if(room.phase === "answer"){
    action = mine ? `<div class="grid2"><button class="main" data-act="ans" data-v="1">Pravda</button><button data-act="ans" data-v="0">Lež</button></div>`
      : `<p class="pill">${esc(roleName(room.turn))} přemýšlí…</p>`;
  } else {
    const ch = room["ch"+me] || 0;
    action = mine ? `<p><strong>Správně. Co teď?</strong></p><div class="menu">
      <button class="main" data-act="ch" data-k="step">${me==="A"?"Postoupit o 1 pole":"Odhodit útočníka o 1 pole"}</button>
      <button data-act="ch" data-k="charge">Nabít sílu (máš ${ch}/2)</button>
      <button data-act="ch" data-k="power" ${ch<2?"disabled":""}>${me==="A"?"Žebřík: +3 pole":"Katapult: −3 pole"} (stojí 2 nabití)</button></div>`
      : `<p class="pill">${esc(roleName(room.turn))} vybírá odměnu…</p>`;
  }
  app.innerHTML = head + `<div class="row"><span class="pill">Jsi: ${roleName(me)}</span><span class="pill">Tah ${room.tc+1} z ${MAX_TURNS}</span></div>
    <div class="track" aria-label="Cesta k hradu">${cells}</div>
    <div class="card"><div class="pill">Na tahu: ${roleName(room.turn)}</div><div class="q">${esc(q.t)}</div>${action}</div>
    <p class="msg">${esc(room.msg || "")}</p>`;
}

/* ---------- Události ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a === "menu") menu();
  else if(a === "find") find();
  else if(a === "create") create();
  else if(a === "settings") settings();
  else if(a === "join") joinRoom(b.dataset.code);
  else if(a === "joincode") joinRoom($("#jc").value);
  else if(a === "docreate") createRoom($("#rn").value.trim());
  else if(a === "savesettings"){ S.name = $("#nm").value.trim(); S.theme = $("#th").value; save(); applyTheme(); toast("Nastavení uloženo"); menu(); }
  else if(a === "start") startGame();
  else if(a === "ans") answer(b.dataset.v === "1");
  else if(a === "ch") choose(b.dataset.k);
  else if(a === "leave") leave();
});

menu();
</script>
</body>
</html>
