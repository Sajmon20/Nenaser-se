<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Obléhání pravdy</title>
<style>
:root{--bg:#0b1026;--bg2:#2a1b4d;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--tx:#eef0ff;--mut:#a2abd6;--ac:#ffcf5a;--atk:#ff7a5c;--def:#4fd1c5;--inp:rgba(0,0,0,.28)}
:root[data-theme=light]{--bg:#eef0fb;--bg2:#e3d9f3;--card:rgba(255,255,255,.85);--line:rgba(30,35,80,.14);--tx:#1b2040;--mut:#5d648c;--inp:rgba(255,255,255,.9)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font:16px/1.5 system-ui,-apple-system,sans-serif;background:radial-gradient(120% 80% at 50% 0,var(--bg2),var(--bg) 70%) fixed}
main{max-width:640px;margin:0 auto;padding:22px 16px 56px}
h1{font:800 clamp(2.3rem,9vw,3.5rem)/1.02 Georgia,serif;letter-spacing:-.02em;margin:18px 0 6px}
h2{font:700 1.5rem Georgia,serif;margin:0 0 10px}
.sub{color:var(--mut);margin:0 0 22px;max-width:46ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;backdrop-filter:blur(8px)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px 18px;transition:transform .12s,border-color .12s}
button:hover:not(:disabled){border-color:var(--ac);transform:translateY(-1px)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
.main{background:var(--ac);color:#25190a;border-color:var(--ac);font-weight:700}
.menu{display:grid;gap:12px}
.menu button{padding:16px;font-size:1.1rem;text-align:center}
input,select{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--inp);margin:6px 0 16px}
select option{color:#111}
label{font-size:.92rem;color:var(--mut)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.back{background:none;border:none;color:var(--mut);padding:4px 0 10px}
.scene{display:block;width:100%;height:auto;border-radius:20px;border:1px solid var(--line)}
.code{font:800 2.8rem Georgia,serif;letter-spacing:.28em;color:var(--ac)}
.q{font:1.4rem/1.35 Georgia,serif;margin:6px 0 18px}
.turn.A{border-left:4px solid var(--atk)}.turn.D{border-left:4px solid var(--def)}
.msg{color:var(--mut);margin:10px 0}
.pill{font-size:.88rem;color:var(--mut)}
.ov{position:fixed;inset:0;background:rgba(5,8,24,.7);display:grid;place-items:center;padding:16px;z-index:5}
.modal{width:100%;max-width:380px;background:var(--bg2)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}

.menu .main{font-size:1.25rem;padding:18px}
.card{position:relative;overflow:hidden}
.sc{position:relative}
.bar{height:8px;border-radius:6px;background:var(--line);margin:12px 0;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--ac)}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.opt small{color:var(--mut)}.opt .ic{font-size:1.6rem}
.pop{position:fixed;left:50%;top:20%;translate:-50% 0;z-index:7;pointer-events:none;text-align:center;background:var(--bg2);border:2px solid var(--ac);border-radius:20px;padding:18px 26px;min-width:250px;max-width:min(90vw,460px);box-shadow:0 20px 60px #000a;animation:pp 3s both}
.pop b{display:block;font:800 1.5rem Georgia,serif}.pop span{color:var(--mut)}
@keyframes pp{0%{opacity:0;scale:.6}10%{opacity:1;scale:1.05}16%{scale:1}85%{opacity:1}100%{opacity:0;scale:.95}}
.ab{position:relative;min-height:56px}
.tpw{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:space-around;animation:gone .3s forwards}
.tp{width:114%;margin-left:-7%;height:34%;background:repeating-linear-gradient(90deg,#e8dab2 0 26px,#d6c48e 26px 28px);box-shadow:0 2px 8px #0008;display:grid;place-items:center;font-weight:800;letter-spacing:.4em;color:#8a7a4d;animation:tin .35s both}
.tp:nth-child(1){rotate:-4deg}.tp:nth-child(2){rotate:3deg;animation-delay:.12s}.tp:nth-child(3){rotate:-2deg;animation-delay:.24s}
@keyframes tin{from{opacity:0;translate:-120% 0}to{opacity:1;translate:0}}
@keyframes gone{to{opacity:0;visibility:hidden}}
.dz .card,.dz .scene{animation:sway 2.6s ease-in-out infinite}
.dz .card{filter:blur(1.2px)}.dz .q{animation:wob 1.7s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2.5deg) translateX(-6px)}50%{transform:rotate(2.5deg) translateX(6px)}}
@keyframes wob{0%,100%{transform:skewX(-6deg)}50%{transform:skewX(6deg) scale(1.03)}}
.spy{position:absolute;inset:0;z-index:3;background:rgba(0,0,0,.78);border-radius:14px;display:grid;place-items:center;text-align:center;padding:8px;color:#fff}
.sp{font-size:2.6rem;animation:spy .8s cubic-bezier(.2,1.2,.4,1) both}
@keyframes spy{from{translate:140% 0;opacity:0}}
.cf{position:absolute;inset:-6px;z-index:2;pointer-events:none;font-size:2.4rem;display:grid;place-items:center;background:radial-gradient(circle at 30% 40%,#5a3a22d0 0 26%,transparent 27%),radial-gradient(circle at 72% 58%,#6b4428d0 0 22%,transparent 23%);animation:spl .5s both}
@keyframes spl{from{opacity:0;scale:.3}}
.pb{background:#fff;color:#222;border-radius:14px;padding:6px 12px;display:inline-block;margin-bottom:8px;animation:pp2 .4s both}
@keyframes pp2{from{opacity:0;translate:0 10px}}
.boulder{position:absolute;font-size:30px;transform:translate(-50%,-50%);z-index:3;transition:left .9s linear,top .9s cubic-bezier(.3,-.8,.7,1)}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" role="status"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,set,get,update,remove,onValue,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyC-CIV9FpMHy67izoGPxYxUVlI-ZWB4Wi0",
  authDomain: "nenaser-se.firebaseapp.com",
  databaseURL: "https://nenaser-se-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "nenaser-se",
  appId: "1:771972269804:web:333862bd4a0e9ed48e07c9"
};

/* Zástupné otázky – t = tvrzení, a = pravda (true) / lež (false), e = vysvětlení */
const Q = [
  {t:"Podle výzkumu RILSA mělo 59 % Romů ve věku 20–64 let maximálně základní vzdělání.",a:true,e:"Zdroj doplníme (RILSA)."},
  {t:"Osm z deseti Romů v ČR má nejvýše základní vzdělání.",a:false,e:"Zdroj doplníme (RILSA)."},
  {t:"48 % romských respondentů, kteří hledali bydlení, uvedlo, že se k nim někdo choval hůře kvůli jejich původu.",a:true,e:"Zdroj doplníme."},
  {t:"V roce 2025 bylo v ČR trestně stíháno přes 4 000 občanů Ukrajiny.",a:true,e:"Zdroj doplníme (policejní statistika)."},
  {t:"Kvůli Ukrajincům vzrostl v roce 2025 celkový počet registrovaných trestných činů v ČR o 3 000.",a:false,e:"Zdroj doplníme (policejní statistika)."},
  {t:"Ukrajinci tvořili v roce 2025 více než 20 % všech trestně stíhaných osob v ČR.",a:false,e:"Zdroj doplníme (policejní statistika)."},
  {t:"Počet trestně stíhaných Ukrajinců v ČR vzrostl mezi roky 2021 a 2024 o více než 100 %.",a:true,e:"Zdroj doplníme (policejní statistika)."},
  {t:"Cizinci v České republice se podílejí na celkovém počtu trestných činů vyšším procentem, než jaký je jejich podíl v české populaci.",a:true,e:"Cizinci tvoří zhruba 10–11 % obyvatel a 12–14 % stíhaných osob. Nejčastěji jde o porušení pobytového režimu a řízení pod vlivem alkoholu, ne o násilnou kriminalitu."},
  {t:"Ukrajinští uprchlíci v ČR vyčerpají na sociálních dávkách ze státního rozpočtu více peněz, než kolik do něj odvedou na daních a odvodech.",a:false,e:"Podle bilancí MPSV se situace otočila v druhé polovině roku 2023 a od roku 2024 jsou příjmy státu od uprchlíků vyšší než výdaje na dávky, zdravotnictví a školství."},
  {t:"Ve Švédsku se od roku 2013 zdvojnásobil počet smrtelných střeleb při vyřizování účtů mezi gangy.",a:true,e:"Podle Brå se Švédsko posunulo z nejnižších míst v Evropě na špičku v počtu střelných úmrtí. Zprávy to spojují s bojem gangů v sociálně vyloučených předměstích."},
  {t:"Více než polovina romských dětí v ČR stále navštěvuje základní školy nebo třídy pro děti s lehkým mentálním postižením.",a:false,e:"Podle ombudsmana a ČŠI je podíl kolem 25–30 %, tedy stále extrémně vysoký, ale ne víc než polovina."},
  {t:"Ve Francii a Německu tvoří cizinci a lidé s migračním původem více než polovinu všech vězňů.",a:false,e:"V Německu tvoří cizinci zhruba 35–38 % vězňů, ve Francii kolem 25 %. Přes 50 % to v některých věznicích u velkých měst vychází jen při započtení druhé generace."},
  {t:"Podle průzkumů FRA žije více než 80 % Romů v ČR pod hranicí chudoby.",a:true,e:"Podle FRA Roma Survey je to zhruba 80–85 % (u většinové populace kolem 9–10 %)."},
  {t:"Počet žadatelů o azyl v EU dosáhl v letech 2023–2024 nejvyšší úrovně od migrační krize v roce 2015.",a:true,e:"Podle EUAA bylo v roce 2023 podáno přes 1,14 milionu žádostí, v roce 2024 kolem 1 milionu."},
  {t:"Většina migrantů, kterým státy EU nařídí vyhoštění, Evropu skutečně opustí.",a:false,e:"Podle Eurostatu je skutečně navráceno jen kolem 20–25 % lidí s rozhodnutím o vyhoštění."},
  {t:"Petr Pavel byl za komunismu člen StB.",a:false,e:"Podle dostupných dokladů nebyl členem StB. Byl členem KSČ a absolvoval kurz komunistické vojenské rozvědky, která spadala pod armádu."},
  {t:"Velká čínská zeď je viditelná pouhým okem z Měsíce.",a:false,e:"Z Měsíce není vidět, je příliš úzká."},
  {t:"Voda se při zamrznutí rozpíná.",a:true,e:"Led má větší objem než voda."},
  {t:"Netopýři jsou slepí.",a:false,e:"Vidí, mnozí dobře, a navíc používají echolokaci."},
  {t:"Blesk nikdy neudeří dvakrát do stejného místa.",a:false,e:"Do vysokých budov udeří i několikrát za rok."}
];
const AN = q => (q.a ? "Pravda. " : "Lež. ") + q.e;
const pick = () => { const seen = (room.seen||"").split(",").filter(Boolean).map(Number); let pool = Q.map((_,i)=>i).filter(i=>!seen.includes(i)); const reset = !pool.length; if(reset) pool = Q.map((_,i)=>i);
  const qi = pool[Math.random()*pool.length|0]; return {qi, seen: reset ? String(qi) : [...seen, qi].join(",")}; };
const WIN = 10, MAX_TURNS = 24;

const db = getDatabase(initializeApp(FIREBASE_CONFIG));
const S = JSON.parse(localStorage.getItem("hra") || "{}");
S.id = S.id || Math.random().toString(36).slice(2, 10);
S.name = S.name || ""; S.theme = S.theme || "dark";
const save = () => localStorage.setItem("hra", JSON.stringify(S));
const applyTheme = () => document.documentElement.dataset.theme = S.theme;
save(); applyTheme();

const $ = s => document.querySelector(s), app = $("#app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rnd = () => Math.floor(Math.random() * Q.length);
const roleName = r => r === "A" ? "Útočník" : "Obránce";
let unsub = null, room = null, code = null, modalRes = null;
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2600)}
const stop = () => { if(unsub){unsub();unsub=null} };

/* ---------- Ilustrace: cesta, hrad a figurky ---------- */
const PT = i => ({x:44+i*42, y:176+9*Math.sin(i*.9)});
const tf = i => { const p = PT(i); return `translate(${p.x}px,${p.y-4}px)`; };
const mer = (x,y,n) => Array.from({length:n},(_,i)=>`<rect x="${x+i*12}" y="${y}" width="7" height="8" fill="#6a6f9c"/>`).join("");
const pawn = (c,t,id,extra) => `<g ${id?`id="${id}"`:""} style="transform:${t};transition:transform .8s cubic-bezier(.3,1.35,.5,1)"><ellipse cy="2" rx="11" ry="3" fill="#0007"/><path d="M-9 0Q-9 -17 0 -19Q9 -17 9 0Z" fill="${c}"/><circle cy="-27" r="8" fill="${c}" stroke="#fff8" stroke-width="1.5"/>${extra}</g>`;
function scene(p, live){
  let stones = ""; for(let i=0;i<=WIN;i++){const q=PT(i);stones+=`<ellipse cx="${q.x}" cy="${q.y}" rx="11" ry="4.5" fill="${i===WIN?"#ffcf5a":"#c9b78d"}" opacity=".85"/>`}
  const stars = [[200,30],[260,62],[330,24],[420,50],[520,20],[600,54],[150,72]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="1.5" fill="#fff" opacity=".8"/>`).join("");
  return `<svg viewBox="0 0 640 240" class="scene" role="img" aria-label="Cesta k hradu">
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1030"/><stop offset=".65" stop-color="#4b2c6e"/><stop offset="1" stop-color="#e98a5c"/></linearGradient></defs>
  <rect width="640" height="240" fill="url(#sky)"/>${stars}<circle cx="80" cy="46" r="20" fill="#fff3cf"/>
  <path d="M0 190Q130 140 270 182T640 160V240H0Z" fill="#241d4d"/><path d="M0 215Q170 185 330 208T640 198V240H0Z" fill="#161233"/>
  ${stones}
  <rect x="498" y="112" width="116" height="92" fill="#575c8a"/>${mer(522,104,6)}
  <rect x="482" y="70" width="36" height="134" fill="#6a6f9c"/><rect x="594" y="70" width="36" height="134" fill="#6a6f9c"/>
  <path d="M478 70L500 36L522 70Z" fill="#c8453b"/><path d="M590 70L612 36L634 70Z" fill="#c8453b"/>
  <path d="M500 36V18l14 5-14 5" fill="#ffcf5a"/><path d="M612 36V18l14 5-14 5" fill="#ffcf5a"/>
  <rect x="497" y="100" width="6" height="12" rx="3" fill="#ffcf5a"/><rect x="609" y="100" width="6" height="12" rx="3" fill="#ffcf5a"/>
  <path d="M536 204V172Q556 146 576 172V204Z" fill="#120d24"/><circle cx="556" cy="184" r="4" fill="#ffcf5a" opacity=".85"/>
  ${pawn("#4fd1c5","translate(556px,112px)","", '<path d="M-17 -16h11v11q-5.5 5-11 0z" fill="#fff" opacity=".9"/>')}
  ${pawn("#ff7a5c",tf(p),live?"pawn":"", '<path d="M13 -6L13 -32" stroke="#fff" stroke-width="3" stroke-linecap="round"/>')}
  </svg>`;
}

/* ---------- Okno s přezdívkou ---------- */
function askName(){
  return new Promise(res => {
    modalRes = res;
    const d = document.createElement("div"); d.className = "ov"; d.id = "modal";
    d.innerHTML = `<div class="card modal" role="dialog" aria-label="Přezdívka"><h2>Jak ti říkat?</h2>
      <label for="mn">Přezdívka uvidí soupeř</label><input id="mn" maxlength="16" value="${esc(S.name)}" autocomplete="off">
      <div class="grid2"><button data-act="mcancel">Zrušit</button><button class="main" data-act="mok">Pokračovat</button></div></div>`;
    document.body.appendChild(d); $("#mn").focus();
  });
}
function closeModal(v){ const m = $("#modal"); if(m) m.remove(); if(modalRes){ modalRes(v); modalRes = null; } }

/* ---------- Obrazovky ---------- */
function menu(){
  stop(); room = null; code = null;
  app.innerHTML = `${scene(0,false)}
    <h1>Obléhání pravdy</h1>
    <p class="sub">Souboj dvou hráčů o hrad. Kdo pozná pravdu, ten postupuje. Kdo se splete, stojí na místě.</p>
    <div class="menu">
      <button class="main" data-act="find">Najít hru</button>
      <div class="grid2"><button data-act="create">Vytvořit hru</button><button data-act="settings">Nastavení</button></div>
    </div>`;
}
function find(){
  app.innerHTML = `<button class="back" data-act="menu">← Zpět do menu</button>
    <h2>Najít hru</h2>
    <div class="card"><label for="jc">Mám kód od kamaráda</label>
      <div class="row"><input id="jc" maxlength="4" placeholder="ABCD" style="margin:0;text-transform:uppercase">
      <button class="main" data-act="joincode">Připojit se</button></div></div>
    <h2 style="margin-top:26px">Veřejné hry</h2><div id="list"><p class="pill">Načítám…</p></div>`;
  stop();
  unsub = onValue(ref(db, "rooms"), s => {
    const v = s.val() || {}, el = $("#list"); if(!el) return;
    const open = Object.entries(v).filter(([,r]) => r.status === "lobby" && r.public !== false && Object.keys(r.players||{}).length < 2);
    el.innerHTML = open.length ? open.map(([c,r]) => `
      <div class="card row"><div><strong>${esc(r.name)}</strong><div class="pill">1v1 · hostitel ${esc(Object.values(r.players)[0].name)}</div></div>
      <button class="main" data-act="join" data-code="${c}">Hrát</button></div>`).join("")
      : '<div class="card pill">Žádná veřejná hra zrovna nečeká. Vytvoř vlastní a pozvi někoho kódem.</div>';
  });
}
function create(){
  app.innerHTML = `<button class="back" data-act="menu">← Zpět do menu</button>
    <h2>Vytvořit hru</h2>
    <div class="card"><label for="rn">Název hry</label><input id="rn" maxlength="30" placeholder="Např. Souboj o hrad">
    <label for="rv">Kdo se může připojit</label>
    <select id="rv"><option value="1">Veřejná: zobrazí se v seznamu her</option><option value="0">Soukromá: jen přes kód</option></select>
    <label for="rm">Režim</label>
    <select id="rm"><option>1v1 hrad (útočník proti obránci)</option>
      <option disabled>Týmy (brzy)</option><option disabled>Každý sám za sebe (brzy)</option><option disabled>Přežití (brzy)</option></select>
    <button class="main" data-act="docreate" style="width:100%">Vytvořit hru</button></div>`;
}
function settings(){
  app.innerHTML = `<button class="back" data-act="menu">← Zpět do menu</button>
    <h2>Nastavení</h2>
    <div class="card"><label for="th">Vzhled</label>
    <select id="th" style="margin-bottom:0"><option value="dark">Tmavý (noc nad hradem)</option><option value="light">Světlý (den)</option></select></div>`;
  $("#th").value = S.theme;
}

/* ---------- Firebase logika ---------- */
async function createRoom(name, rname, isPublic){
  S.name = name; save();
  const L = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  const c = Array.from({length:4}, () => L[Math.random()*L.length|0]).join("");
  await set(ref(db, "rooms/" + c), {name: rname || "Hra " + c, public: isPublic, status:"lobby", host:S.id, created:Date.now(),
    players:{[S.id]:{name, role:"A"}}});
  enter(c);
}
async function joinRoom(c, name){
  c = (c||"").toUpperCase().trim(); S.name = name; save();
  const s = await get(ref(db, "rooms/" + c));
  if(!s.exists()) return toast("Hra s tímto kódem neexistuje");
  const v = s.val();
  if(v.players && v.players[S.id]) return enter(c);
  if(v.status !== "lobby" || Object.keys(v.players).length >= 2) return toast("Hra je plná nebo už běží");
  const hr = Object.values(v.players)[0].role;
  await update(ref(db, `rooms/${c}/players/${S.id}`), {name, role: hr === "A" ? "D" : "A"});
  enter(c);
}
function enter(c){
  stop(); code = c; lastEv = undefined; lastSig = "";
  unsub = onValue(ref(db, "rooms/" + c), s => {
    room = s.val();
    if(!room){ menu(); toast("Hra skončila nebo byla zrušena"); return; }
    drawRoom();
    const ev = room.ev;
    if(lastEv === undefined) lastEv = ev ? ev.id : null;
    else if(ev && ev.id !== lastEv){ lastEv = ev.id; const m = myRole(); if(ev[m]) pop(ev[m]); if(ev.k === "catapult") boulder(ev.p0); }
  });
}
const R = () => ref(db, "rooms/" + code);
const myRole = () => room.players[S.id]?.role;
let off = 0, lastEv, busy = "", lastSig = "";
onValue(ref(db, ".info/serverTimeOffset"), s => off = s.val() || 0);
const now = () => Date.now() + off, ROUND_MS = 20000, MAX_ROUNDS = 14;
const evt = (a, d) => ({id: Math.random().toString(36).slice(2), A: a, D: d});
const GD = {
  blind:{n:"Páska na oči",d:"Soupeř bude 3 s slepý",i:"🩹"},
  dizzy:{n:"Nízký tlak",d:"Soupeři se bude motat hlava",i:"😵‍💫"},
  trojan:{n:"Trojan",d:"Špeh zablokuje soupeři odpovídání v příštím kole",i:""},
  catapult:{n:"Katapult",d:"Útočník o 2 pole zpět, ty příště bez vylepšováku",i:"🪨"}
};
const CYC = {A:["blind","dizzy","trojan"], D:["blind","dizzy","catapult"]};
const SPY = '<svg viewBox="0 0 200 110" width="170" class="sp" aria-hidden="true"><ellipse cx="100" cy="106" rx="92" ry="3" fill="#0006"/><g fill="#a9742f" stroke="#5b3a14" stroke-width="2"><rect x="72" y="42" width="82" height="30" rx="10"/><rect x="78" y="70" width="8" height="26"/><rect x="96" y="70" width="8" height="26"/><rect x="124" y="70" width="8" height="26"/><rect x="142" y="70" width="8" height="26"/><path d="M146 48L168 20L184 28L160 60Z"/><path d="M168 20L172 8L180 22Z"/></g><path d="M80 52h66M80 60h66" stroke="#5b3a14" stroke-width="2"/><path d="M152 42q8-14 14-20" stroke="#3a2410" stroke-width="5" fill="none"/><circle cx="177" cy="30" r="2.5" fill="#222"/><path d="M20 54Q35 46 50 54L56 100H14Z" fill="#3b4a6b"/><path d="M30 52L35 66L40 52" fill="#cfd6ea"/><circle cx="35" cy="40" r="10" fill="#f1c9a5"/><rect x="25" y="37" width="20" height="6" rx="2" fill="#111"/><ellipse cx="35" cy="30" rx="19" ry="4" fill="#1c1c1c"/><rect x="25" y="17" width="20" height="13" rx="3" fill="#1c1c1c"/><path d="M48 62L74 68" stroke="#3b4a6b" stroke-width="8" stroke-linecap="round"/></svg>';
function swapRoles(){
  if(!room || room.status !== "lobby") return;
  const u = {}; for(const [id,p] of Object.entries(room.players)) u[`players/${id}/role`] = p.role === "A" ? "D" : "A";
  update(R(), u);
}
function startGame(){
  const t = ["Souboj začíná!", "Odpověz rychleji než soupeř"];
  update(R(), {status:"playing", phase:"answer", pos:0, rn:0, ...pick(), rs:serverTimestamp(), ans:null, ev:evt(t, t)});
}
function nextRound(p){
  const pos = p.pos ?? room.pos;
  if(pos >= WIN) return update(R(), {...p, status:"finished", winner:"A"});
  if(room.rn + 1 >= MAX_ROUNDS) return update(R(), {...p, status:"finished", winner:"D"});
  update(R(), {...p, rn:room.rn+1, phase:"answer", ...pick(), rs:serverTimestamp(), ans:null, win:null,
    fx:p.pfx || null, noG:p.pnoG || null, pfx:null, pnoG:null});
}
function answer(v){
  const me = myRole();
  if(room.phase !== "answer" || room.ans?.[me] || room.fx?.[me]?.trojan || now() > room.rs + ROUND_MS) return;
  set(ref(db, `rooms/${code}/ans/${me}`), {v, t:serverTimestamp()});
}
function resolve(){
  const a = room.ans || {}, need = ["A","D"].filter(r => !room.fx?.[r]?.trojan);
  if(!(need.every(r => a[r]) || now() > room.rs + ROUND_MS + 500)) return false;
  const q = Q[room.qi], ok = ["A","D"].filter(r => a[r] && a[r].v === q.a).sort((x,y) => a[x].t - a[y].t), w = ok[0];
  if(!w){ const t = ["Nikdo nebodoval", AN(q)]; update(R(), {phase:"result", ra:serverTimestamp(), ev:evt(t, t)}); return true; }
  const sec = ((a[w].t - room.rs) / 1000).toFixed(1), o = w === "A" ? "D" : "A";
  update(R(), {phase:"reward", win:w, ra:serverTimestamp(),
    ev:{id:Math.random().toString(36).slice(2), [w]:[`Byl jsi nejrychlejší! (${sec} s)`, AN(q)], [o]:[`${roleName(w)} byl rychlejší (${sec} s)`, AN(q)]}});
  return true;
}
function reward(k, r){
  if(room.phase !== "reward" || room.win !== r) return;
  if(k !== "step" && k !== CYC[r][room.rn % 3]) return;
  const o = r === "A" ? "D" : "A", p = {}; let pos = room.pos, ev;
  if(k === "step"){
    pos = r === "A" ? pos + 1 : Math.max(0, pos - 1);
    ev = r === "A" ? evt(["Postupuješ o 1 pole","Hrad je blíž"], ["Útočník postoupil","O 1 pole blíž k hradu"])
                   : evt(["Obránce tě posunul zpět!","Zpět o 1 pole"], ["Odhodil jsi útočníka","O 1 pole zpět"]);
  } else {
    const g = GD[k];
    if(k === "catapult"){
      pos = Math.max(0, pos - 2); p.pnoG = r;
      ev = evt(["🪨 Katapult tě odhodil!","O 2 pole zpět"], ["🪨 Katapult odpálen!","Útočník −2 pole, příště bez vylepšováku"]); ev.k = "catapult"; ev.p0 = room.pos;
    } else {
      p.pfx = {[o]:{[k]:true}};
      const mine = [(g.i ? g.i + " " : "") + g.n, "Použito na soupeře"], his = [(g.i ? g.i + " " : "") + g.n + "!", "Soupeř ti poslal: " + g.d];
      ev = r === "A" ? evt(mine, his) : evt(his, mine);
    }
  }
  nextRound({...p, pos, ev});
}
function pop(t){ const d = document.createElement("div"); d.className = "pop"; d.innerHTML = `<b>${esc(t[0])}</b><span>${esc(t[1]||"")}</span>`; document.body.appendChild(d); setTimeout(() => d.remove(), 3000); }
function boulder(p0){
  const sc = $(".sc"); if(!sc) return;
  const e = document.createElement("div"); e.className = "boulder"; e.textContent = "🪨"; e.style.left = "87%"; e.style.top = "45%"; sc.appendChild(e);
  const q = PT(p0); requestAnimationFrame(() => requestAnimationFrame(() => { e.style.left = q.x/6.4 + "%"; e.style.top = (q.y-14)/2.4 + "%"; }));
  setTimeout(() => e.remove(), 1300);
}
setInterval(() => {
  if(!room || room.status !== "playing" || !room.rs) return;
  const t = now();
  if(room.phase === "answer"){
    const l = Math.max(0, ROUND_MS - (t - room.rs)), b = $("#bar"), tm = $("#tm");
    if(b){ b.style.width = l/ROUND_MS*100 + "%"; b.style.background = l < 5000 ? "var(--atk)" : "var(--ac)"; }
    if(tm) tm.textContent = Math.ceil(l/1000) + " s";
  }
  if(room.host !== S.id) return;
  const key = room.rn + room.phase; if(busy === key) return;
  let go = false;
  if(room.phase === "answer") go = resolve();
  else if(room.phase === "result" && room.ra && t > room.ra + 3500){ nextRound({}); go = true; }
  else if(room.phase === "reward" && room.ra && t > room.ra + 20000){ reward("step", room.win); go = true; }
  if(go) busy = key;
}, 250);
async function leave(){
  if(room && code){
    if(room.host === S.id || room.status !== "lobby") await remove(R());
    else await remove(ref(db, `rooms/${code}/players/${S.id}`));
  }
  menu();
}

/* ---------- Vykreslení hry ---------- */
function drawRoom(){
  const ps = Object.entries(room.players), me = myRole();
  const head = `<button class="back" data-act="leave">← Opustit hru</button>`;
  if(room.status === "lobby"){
    app.innerHTML = head + `<h2>${esc(room.name)}</h2>
      <p class="sub">${room.public === false ? "Soukromá hra. Pošli kamarádovi tento kód." : "Veřejná hra. Soupeř ji najde v seznamu, nebo mu pošli kód."}</p>
      <div class="card"><div class="code">${code}</div></div>
      <div class="card">${ps.map(([,p]) => `<div class="row"><span>${esc(p.name)}</span><span class="pill">${roleName(p.role)}</span></div>`).join("")}
      ${ps.length < 2 ? '<p class="pill" style="margin-bottom:0">Čekám na soupeře…</p>' : ""}</div>
      <button data-act="swap" style="width:100%;margin-bottom:12px">⇄ Vyměnit role (útočník ↔ obránce)</button>
      ${room.host === S.id ? `<button class="main" data-act="start" style="width:100%" ${ps.length<2?"disabled":""}>Spustit hru</button>` : '<p class="pill">Hostitel spustí hru.</p>'}`;
    return;
  }
  if(room.status === "finished"){
    const won = room.winner === me;
    app.innerHTML = head + scene(room.pos,false) + `<h1>${won ? "Vyhráváš!" : "Tentokrát ne"}</h1>
      <p class="sub">${room.winner==="A" ? "Útočník dobyl hrad." : "Obránce ubránil hrad."}</p>
      <button class="main" data-act="leave" style="width:100%">Zpět do menu</button>`;
    return;
  }
  if(!$("#panel")){ lastSig = ""; app.innerHTML = head + `<div class="row" style="margin-bottom:10px"><span class="pill" id="top"></span><span class="pill" id="tm"></span></div><div class="sc">${scene(room.pos,true)}</div><div class="bar"><i id="bar"></i></div><div id="panel"></div>`; }
  $("#top").textContent = `Jsi ${roleName(me).toLowerCase()} · kolo ${room.rn+1}/${MAX_ROUNDS} · pole ${room.pos}/${WIN}`;
  $("#pawn").style.transform = tf(room.pos);
  const o = me === "A" ? "D" : "A", fx = room.fx?.[me] || {};
  app.classList.toggle("dz", !!fx.dizzy && room.phase === "answer");
  const sig = [room.rn, room.phase, !!room.ans?.[me], !!room.ans?.[o], room.win, room.noG].join("|");
  if(sig === lastSig) return; lastSig = sig;
  const q = Q[room.qi]; let h;
  if(room.phase === "answer"){
    const done = room.ans?.[me], left = fx.blind ? 3000 - (now() - room.rs) : 0;
    const b = ['<button class="main" data-act="ans" data-v="1">Pravda</button>', '<button data-act="ans" data-v="0">Lež</button>']; 
    h = `<div class="card turn ${me}">
      ${left > 0 ? `<div class="tpw" style="animation-delay:${Math.max(0,left-300)}ms"><div class="tp">PÁSKA</div><div class="tp">PÁSKA</div><div class="tp">PÁSKA</div></div>` : ""}
      <div class="q">${esc(q.t)}</div>
      <div class="ab">${done ? `<p class="pill">Odpověď odeslána. ${room.ans?.[o] ? "Soupeř už odpověděl." : "Čekám na soupeře…"}</p>` : `<div class="grid2">${b.join("")}</div>`}
      ${fx.trojan ? `<div class="spy"><div>${SPY}<br><b>Trojský kůň zablokoval tvoje odpovědi</b></div></div>` : ""}
      </div></div>`;
  } else if(room.phase === "result"){
    h = `<div class="card"><div class="q">${esc(q.t)}</div><p class="pill">Další kolo začíná…</p></div>`;
  } else if(room.win === me){
    const lock = room.noG === me;
    h = `<div class="card turn ${me}"><strong>Byl jsi nejrychlejší. Vyber si odměnu:</strong><div class="opts">
      <button class="main opt" data-act="rw" data-k="step"><b>${me === "A" ? "Postoupit o 1 pole" : "Odhodit útočníka o 1 pole"}</b></button>` +
      (() => { const k = CYC[me][room.rn % 3], g = GD[k], ic = g.i || SPY.replace(' class="sp"', "").replace('width="170"', 'width="64"');
        return `<button class="opt" data-act="rw" data-k="${k}" ${lock ? "disabled" : ""}><span class="ic">${ic}</span><span><b>${g.n}</b><br><small>${g.d}</small></span></button>`; })() +
      `</div>${lock ? '<p class="pill">Po katapultu nemůžeš v tomto kole použít vylepšovák.</p>' : ""}</div>`;
  } else h = `<div class="card"><p class="pill">${roleName(room.win)} vybírá odměnu…</p></div>`;
  $("#panel").innerHTML = h;
}

/* ---------- Události ---------- */
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a === "menu") menu();
  else if(a === "find") find();
  else if(a === "create") create();
  else if(a === "settings") settings();
  else if(a === "mok"){ const n = $("#mn").value.trim(); if(!n) return toast("Napiš přezdívku"); closeModal(n); }
  else if(a === "mcancel") closeModal(null);
  else if(a === "join"){ const n = await askName(); if(n) joinRoom(b.dataset.code, n); }
  else if(a === "joincode"){ const c = $("#jc").value.trim(); if(c.length < 4) return toast("Kód má 4 písmena"); const n = await askName(); if(n) joinRoom(c, n); }
  else if(a === "docreate"){ const rn = $("#rn").value.trim(), pub = $("#rv").value === "1"; const n = await askName(); if(n) createRoom(n, rn, pub); }
  else if(a === "swap") swapRoles();
  else if(a === "start") startGame();
  else if(a === "ans") answer(b.dataset.v === "1");
  else if(a === "rw") reward(b.dataset.k, myRole());
  else if(a === "leave") leave();
});
document.addEventListener("change", e => { if(e.target.id === "th"){ S.theme = e.target.value; save(); applyTheme(); } });
document.addEventListener("keydown", e => { if(e.key === "Enter" && $("#mn")) $('[data-act="mok"]').click(); });

menu();
</script>
</body>
</html>
