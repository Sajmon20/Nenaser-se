<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<title>Obléhání pravdy</title>
<style>
:root{--bg:#090c20;--bg2:#1d1346;--card:rgba(255,255,255,.065);--line:rgba(255,255,255,.12);--tx:#f3f1ff;--mut:#a9b0d8;--ac:#eec45e;--atk:#ff7a5c;--def:#4fd1c5;--ok:#5ee38a;--bad:#ff6b6b;--inp:rgba(6,8,28,.45);--gold:linear-gradient(135deg,#efd07f 0%,#dba844 58%,#c98a30 100%);--shadow:0 12px 34px rgba(0,0,0,.35);--r:22px}
:root[data-theme=light]{--bg:#f2f0fb;--bg2:#ddd3f5;--card:rgba(255,255,255,.8);--line:rgba(40,30,90,.14);--tx:#1d1a3b;--mut:#625f8c;--inp:rgba(255,255,255,.96);--shadow:0 12px 30px rgba(60,40,120,.16)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font:16px/1.5 system-ui,-apple-system,sans-serif;background:radial-gradient(120% 80% at 50% 0,var(--bg2),var(--bg) 70%) fixed}
main{max-width:640px;margin:0 auto;padding:22px 16px 56px}
h1{font:800 clamp(2.3rem,9vw,3.5rem)/1.02 Georgia,serif;letter-spacing:-.02em;margin:18px 0 6px}
h2{font:700 1.5rem Georgia,serif;margin:0 0 10px}
.sub{color:var(--mut);margin:0 0 22px;max-width:46ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;backdrop-filter:blur(8px)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px 18px;transition:transform .12s,border-color .12s}
button:hover:not(:disabled){border-color:var(--ac);transform:translateY(-1px)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
.main{background:var(--ac);color:#25190a;border-color:var(--ac);font-weight:700}
.menu{display:grid;gap:12px}
.menu button{padding:16px;font-size:1.1rem;text-align:center}
input,select{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--inp);margin:6px 0 16px}
select option{color:#111}
label{font-size:.92rem;color:var(--mut)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.back{background:none;border:none;color:var(--mut);padding:4px 0 10px}
.scene{display:block;width:100%;height:auto;border-radius:20px;border:1px solid var(--line)}
.code{font:800 2.8rem Georgia,serif;letter-spacing:.28em;color:var(--ac)}
.q{font:1.4rem/1.35 Georgia,serif;margin:6px 0 18px}
.turn.A,.turn.A1,.turn.A2,.turn.A3{border-left:4px solid var(--atk)}.turn.D{border-left:4px solid var(--def)}
.msg{color:var(--mut);margin:10px 0}
.pill{font-size:.88rem;color:var(--mut)}
.ov{position:fixed;inset:0;background:rgba(5,8,24,.7);display:grid;place-items:center;padding:16px;z-index:5}
.modal{width:100%;max-width:380px;background:var(--bg2)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}

.menu .main{font-size:1.25rem;padding:18px}
.card{position:relative;overflow:hidden}
.sc{position:relative}
.bar{height:8px;border-radius:6px;background:var(--line);margin:12px 0;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--ac)}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.opt small{color:var(--mut)}.opt .ic{font-size:1.6rem}
.pop{position:fixed;left:50%;top:20%;translate:-50% 0;z-index:7;pointer-events:none;text-align:center;background:var(--bg2);border:2px solid var(--ac);border-radius:20px;padding:18px 26px;min-width:250px;max-width:min(90vw,460px);box-shadow:0 20px 60px #000a;animation:pp 3s both}
.pop b{display:block;font:800 1.5rem Georgia,serif}.pop span{color:var(--mut)}
@keyframes pp{0%{opacity:0;scale:.6}10%{opacity:1;scale:1.05}16%{scale:1}85%{opacity:1}100%{opacity:0;scale:.95}}
.ab{position:relative;min-height:56px}
.tpw{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:space-around;animation:gone .3s forwards}
.tp{width:114%;margin-left:-7%;height:34%;background:repeating-linear-gradient(90deg,#e8dab2 0 26px,#d6c48e 26px 28px);box-shadow:0 2px 8px #0008;display:grid;place-items:center;font-weight:800;letter-spacing:.4em;color:#8a7a4d;animation:tin .35s both}
.tp:nth-child(1){rotate:-4deg}.tp:nth-child(2){rotate:3deg;animation-delay:.12s}.tp:nth-child(3){rotate:-2deg;animation-delay:.24s}
@keyframes tin{from{opacity:0;translate:-120% 0}to{opacity:1;translate:0}}
@keyframes gone{to{opacity:0;visibility:hidden}}
.dz main{animation:dzb 2.4s ease-in-out infinite}
.dz .card,.dz .scene{animation:sway 2.6s ease-in-out infinite}
.dz .grid2 button{animation:drift 1.9s ease-in-out infinite}.dz .grid2 button:nth-child(2){animation-direction:reverse}
.dzc{display:inline-block;font-style:normal;animation:bob 1.1s ease-in-out infinite}
.dz::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:6;background:radial-gradient(circle at 50% 45%,transparent 22%,#000 82%);animation:tun 3.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-4deg) translateX(-12px)}50%{transform:rotate(4deg) translateX(12px)}}
@keyframes dzb{0%,100%{filter:blur(.6px) saturate(.8)}50%{filter:blur(3px) saturate(.35)}}
@keyframes drift{0%,100%{transform:translate(-14px,3px)}50%{transform:translate(14px,-3px)}}
@keyframes bob{0%,100%{transform:translateY(-4px) rotate(-9deg)}50%{transform:translateY(4px) rotate(9deg)}}
@keyframes tun{0%,100%{opacity:.2}50%{opacity:.85}}
.spy{position:absolute;inset:0;z-index:3;background:rgba(0,0,0,.78);border-radius:14px;display:grid;place-items:center;text-align:center;padding:8px;color:#fff}
.sp{font-size:2.6rem;animation:spy .8s cubic-bezier(.2,1.2,.4,1) both}
@keyframes spy{from{translate:140% 0;opacity:0}}
.cf{position:absolute;inset:-6px;z-index:2;pointer-events:none;font-size:2.4rem;display:grid;place-items:center;background:radial-gradient(circle at 30% 40%,#5a3a22d0 0 26%,transparent 27%),radial-gradient(circle at 72% 58%,#6b4428d0 0 22%,transparent 23%);animation:spl .5s both}
@keyframes spl{from{opacity:0;scale:.3}}
.pb{background:#fff;color:#222;border-radius:14px;padding:6px 12px;display:inline-block;margin-bottom:8px;animation:pp2 .4s both}
@keyframes pp2{from{opacity:0;translate:0 10px}}
.boulder{position:absolute;font-size:30px;transform:translate(-50%,-50%);z-index:3;transition:left .9s linear,top .9s cubic-bezier(.3,-.8,.7,1)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.av{display:inline-grid;place-items:center;border-radius:50%;object-fit:cover;background:var(--line);font-weight:700;flex:none}
.tg{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 9px;border-radius:99px;background:var(--ac);color:#25190a;margin-left:7px;vertical-align:middle}
.chip{display:flex;align-items:center;gap:10px}
input,select,textarea{font:inherit;color:inherit}
textarea{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--inp);margin:6px 0 16px;resize:vertical}
.card.vis{overflow:visible}
.dd{position:relative;margin-top:6px}
.ddb{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;background:var(--inp)}
.ddb span,.ddo{display:grid}
.dd small{color:var(--mut);font-size:.82rem;font-weight:400}
.chev{width:9px;height:9px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);rotate:45deg;translate:0 -2px;transition:rotate .2s;flex:none}
.dd.open .chev,.advb.open .chev{rotate:225deg;translate:0 2px}
.ddl{display:none;position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:4;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 14px 40px #0009}
.dd.open .ddl{display:grid;gap:4px}
.ddo{text-align:left;border:none;background:transparent;padding:10px 12px;border-radius:10px}
.ddo:hover:not(:disabled){background:var(--card)}
.ddo.sel{background:var(--card);box-shadow:inset 3px 0 0 var(--ac)}
.advb{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:14px;background:transparent}
.adv{display:none;padding-top:12px}.adv.open{display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chp{padding:8px 14px;border-radius:99px}
.chp.on{background:var(--ac);color:#25190a;border-color:var(--ac);font-weight:700}
.tabs{margin:0 0 14px}
.bell{position:relative;padding:8px 12px;border-radius:99px}
.bell b{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;border-radius:99px;background:var(--atk);color:#fff;font-size:.72rem;display:grid;place-items:center}
.fab{position:fixed;right:20px;bottom:20px;width:52px;height:52px;border-radius:50%;font:800 1.4rem Georgia,serif;padding:0;background:var(--ac);color:#25190a;border-color:var(--ac);box-shadow:0 8px 24px #0008;z-index:3}
.lb{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;border:1px solid transparent}
.lb.me{background:var(--card);border-color:var(--ac);box-shadow:inset 4px 0 0 var(--ac)}
.rk{width:34px;font-weight:800;color:var(--mut)}.lb.me .rk{color:var(--ac)}
.lbn{flex:1;min-width:0}.pts{font-weight:700}
.you{margin-left:8px;font-size:.72rem;color:var(--ac);font-weight:800}
.sw{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.swb{width:36px;height:36px;border-radius:50%;padding:0;border:2px solid transparent}
.swb.on{border-color:var(--tx);box-shadow:0 0 0 3px var(--bg2)}
.swb.none{background:var(--card);font-weight:800}
.prev{margin:6px 0 14px;padding:12px;border-radius:12px;background:var(--inp)}
.unread{border-color:var(--ac)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.pc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:18px 10px;min-height:156px;text-align:center;border-radius:18px;line-height:1.25}
.pc .big{font:800 2.3rem/1 Georgia,serif}
.pc .ic{font-size:2.3rem;line-height:1}
.pc small{font-weight:400;opacity:.85}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
.hh{font:700 1.1rem Georgia,serif;margin:20px 0 6px}
.hl{padding-left:20px;margin:6px 0}.hl li{margin:5px 0}
.hg{display:flex;gap:14px;align-items:center}
.hgi{flex:none;width:86px;display:grid;place-items:center}
.hg p{margin:4px 0 0;color:var(--mut)}

/* ===== Design v2 ===== */
body{font-family:"Nunito",system-ui,-apple-system,sans-serif;font-weight:600;background:radial-gradient(90% 60% at 50% -10%,var(--bg2),transparent 70%),radial-gradient(70% 50% at 100% 100%,rgba(79,209,197,.09),transparent 60%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1.2px 1.2px at 28% 62%,#fff,transparent),radial-gradient(1.5px 1.5px at 47% 12%,#fff,transparent),radial-gradient(1px 1px at 63% 40%,#fff,transparent),radial-gradient(1.5px 1.5px at 78% 22%,#fff,transparent),radial-gradient(1.2px 1.2px at 90% 70%,#fff,transparent),radial-gradient(1px 1px at 8% 82%,#fff,transparent),radial-gradient(1.2px 1.2px at 55% 88%,#fff,transparent);animation:twk 6s ease-in-out infinite alternate}
:root[data-theme=light] body::before{display:none}
@keyframes twk{from{opacity:.25}to{opacity:.7}}
main{padding:20px 16px 100px}
h1{font:800 clamp(2.1rem,9vw,3.2rem)/1.05 "Cinzel",Georgia,serif;letter-spacing:.02em;text-align:center;margin:22px 0 8px;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(255,170,40,.25))}
h2{font:800 1.4rem "Cinzel",Georgia,serif;letter-spacing:.02em}
.hh{font-family:"Cinzel",Georgia,serif}
.sub{text-align:center;margin:0 auto 20px;color:var(--mut)}
label{font-weight:800;letter-spacing:.04em;font-size:.76rem;text-transform:uppercase;color:var(--mut)}
.card{background:linear-gradient(180deg,rgba(255,255,255,.095),rgba(255,255,255,.04));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.07);backdrop-filter:blur(14px)}
:root[data-theme=light] .card{background:var(--card)}
button{font-weight:800;border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.04));transition:transform .15s,box-shadow .2s,border-color .2s;-webkit-tap-highlight-color:transparent}
:root[data-theme=light] button{background:rgba(255,255,255,.85)}
button:hover:not(:disabled){border-color:rgba(255,201,77,.65);transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.25)}
button:active:not(:disabled){transform:scale(.97)}
.main{background:var(--gold)!important;color:#2a1a05;border:none;box-shadow:0 8px 24px rgba(255,170,40,.35),inset 0 1px 0 rgba(255,255,255,.5)}
.main:hover:not(:disabled){box-shadow:0 12px 30px rgba(255,170,40,.5);border-color:transparent}
input,select,textarea{border-radius:14px;font-weight:600}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(255,201,77,.22)}
.back{display:inline-flex;align-items:center;gap:6px;background:transparent!important;border:none;box-shadow:none!important;color:var(--mut);padding:6px 4px 12px}
.back:hover:not(:disabled){transform:none;color:var(--tx)}
.av{box-shadow:0 0 0 2px rgba(255,255,255,.16)}
.tg{font-weight:800;background:var(--gold);box-shadow:0 2px 10px rgba(255,170,40,.3)}
.hero .scene{border:none;border-radius:26px;box-shadow:0 18px 50px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.1)}
.cta{display:flex;align-items:center;justify-content:center;gap:12px;padding:20px!important;font-size:1.2rem!important}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px!important}
.tile.wide{flex-direction:row;justify-content:center;padding:14px!important}
.mecard{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);margin:0 0 14px;cursor:pointer}
.mei{flex:1;min-width:0}.mei b{font-weight:800}
.pts2{display:flex;align-items:center;gap:5px;color:var(--ac);font-weight:800;font-size:.85rem}
.fab{background:var(--gold)!important;color:#2a1a05;border:none;font:800 1.5rem "Cinzel",Georgia,serif;animation:fabp 3s ease-in-out infinite}
@keyframes fabp{0%,100%{box-shadow:0 8px 24px #0008,0 0 0 0 rgba(255,201,77,.5)}50%{box-shadow:0 8px 24px #0008,0 0 0 10px rgba(255,201,77,0)}}
.bell{display:inline-flex;align-items:center;justify-content:center;line-height:0}
.badge{width:64px;height:64px;margin:6px auto 10px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#2a1a05;box-shadow:0 10px 30px rgba(255,170,40,.4)}
.empty{text-align:center;padding:26px 10px;color:var(--mut)}.empty svg{opacity:.7;margin-bottom:6px}
.gm{display:flex;align-items:center;justify-content:space-between;gap:12px}
/* lobby */
.ticket{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-radius:22px;border:1px dashed rgba(255,201,77,.6);background:linear-gradient(135deg,rgba(255,201,77,.15),rgba(255,201,77,.03));margin:12px 0}
.code{font:800 2.6rem/1 "Cinzel",Georgia,serif;letter-spacing:.3em;color:var(--ac)}
.tkb{display:inline-flex;gap:6px;align-items:center;padding:10px 14px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.facts span{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:800;padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--mut)}
.pl{padding:12px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin:10px 0}

.pl-top{display:flex;align-items:center;gap:12px}

.pl-name{font-weight:800;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.crown{color:var(--ac);display:inline-flex;margin-right:2px;filter:drop-shadow(0 0 6px rgba(255,201,77,.7))}
.role,.rolechip{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:800;padding:2px 10px;border-radius:99px;letter-spacing:.04em}
.role.atk,.rolechip.atk{background:rgba(255,122,92,.2);color:#ffb3a0}.role.def,.rolechip.def{background:rgba(79,209,197,.2);color:#8ee9df}
:root[data-theme=light] .role.atk,:root[data-theme=light] .rolechip.atk{color:#c4452a}:root[data-theme=light] .role.def,:root[data-theme=light] .rolechip.def{color:#12857a}
.kick{padding:9px;border-radius:12px;color:var(--bad);line-height:0}
.rchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.rc{padding:6px 12px;border-radius:99px;font-size:.76rem}
.rc.on{background:var(--gold)!important;color:#2a1a05;border:none}
.av.ghost{background:transparent;border:2px dashed var(--line);box-shadow:none}
/* hra */
.hud{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px}
.rolechip{padding:7px 14px;font-size:.85rem}
.hud-mid{flex:1;text-align:center;font-weight:800;color:var(--mut);font-size:.9rem}
.ring{position:relative;width:46px;height:46px;flex:none}
.ring svg{transform:rotate(-90deg)}
.rg-bg{fill:none;stroke:var(--line);stroke-width:4}
.rg{fill:none;stroke:var(--ac);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .25s linear,stroke .3s}

@keyframes rp{to{transform:scale(1.12)}}
.strip{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.st{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:99px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--c);font-size:.82rem;font-weight:800}
.st i{display:inline-flex;color:var(--ok);min-width:14px}.st.ok{border-color:rgba(94,227,138,.55);border-left-color:var(--c)}
.q{font:800 1.28rem/1.4 "Nunito",sans-serif;text-align:center;margin:8px 0 20px}
.turn.A,.turn.A1,.turn.A2,.turn.A3,.turn.D{border-left:1px solid var(--line)}
.turn.A,.turn.A1,.turn.A2,.turn.A3{box-shadow:var(--shadow),inset 0 3px 0 var(--atk)}.turn.D{box-shadow:var(--shadow),inset 0 3px 0 var(--def)}
.ans{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:92px;font-size:1.2rem}
.ans.yes{background:linear-gradient(180deg,rgba(94,227,138,.3),rgba(94,227,138,.1))!important;border-color:rgba(94,227,138,.55)}

.pc .big{font-family:"Cinzel",Georgia,serif}
.pop{top:14%;color:#f3f1ff;border:none;background:linear-gradient(180deg,#2c2063,#17113a);border-radius:22px;padding:20px 26px;box-shadow:0 24px 70px rgba(0,0,0,.6),0 0 0 1px rgba(255,201,77,.55),0 0 40px rgba(255,170,40,.18)}
.pop b{font:800 1.3rem "Cinzel",Georgia,serif;color:var(--ac)}.pop span{color:#b9bfe6}
#toast{background:rgba(22,17,54,.94);color:#fff;border:1px solid rgba(255,255,255,.16);border-radius:99px;padding:12px 20px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.4);backdrop-filter:blur(10px);transform:translate(-50%,16px);transition:opacity .25s,transform .25s;max-width:90vw;text-align:center;z-index:9}

.result{text-align:center}

async function addSong(){

      await set(ref(db, "musicData/" + id), d); await set(ref(db, "music/" + id), {title:t, ts:Date.now()});

    return;
  }
  if(!$("#panel")){ lastSig = ""; app.innerHTML = head + `<div class="hud"><span class="rolechip ${me === "D" ? "def" : "atk"}" id="top">${ic(me === "D" ? "shield" : "sword", 16)}${roleName(me)}</span><div class="hud-mid" id="rnd"></div><div class="ring" id="ringw"><svg viewBox="0 0 44 44" width="46" height="46"><circle class="rg-bg" cx="22" cy="22" r="18"/><circle class="rg" id="rg" cx="22" cy="22" r="18" stroke-dasharray="113.1" stroke-dashoffset="0"/></svg><span id="tm"></span></div></div><div class="sc">${scene(room.pos,true)}</div><div class="pill" id="lg" style="margin-top:8px"></div><div class="strip" id="strip"></div><div id="panel"></div>`; }
  $("#rnd").textContent = `Kolo ${room.rn+1}/${MR()}${n3 ? "" : " · pole " + room.pos + "/" + WIN}`;
  if(n3){
    ATT(room.mode).forEach((r,i,ks) => { const e = $("#pw_" + r); if(e) e.style.transform = tf3(room.pos[r] || 0, i, ks.length); });
    $("#lg").innerHTML = ATT(room.mode).map(r => `<span style="color:${ACOL[r]}">●</span> ${esc(nm(r))} ${room.pos[r] || 0}/${WIN}`).join(" &nbsp; ");
  } else $("#pawn").style.transform = tf(room.pos);
  const o = me === "A" ? "D" : "A", fx = room.fx?.[me] || {};
  document.body.classList.toggle("dz", !!fx.dizzy && room.phase === "answer");
  const sig = [room.rn, room.phase, !!room.ans?.[me], !!room.ans?.[o], Object.keys(room.ans || {}).length, room.win, room.noG].join("|");
  if(sig === lastSig) return; lastSig = sig;
  const q = room.qq; let h;
  if(room.phase === "answer"){
    const done = room.ans?.[me], left = fx.blind ? 3000 - (now() - room.rs) : 0;
    const b = [`<button class="ans yes" data-act="ans" data-v="1">${ic("check", 28)}<span>Pravda</span></button>`, `<button class="ans no" data-act="ans" data-v="0">${ic("x", 28)}<span>Lež</span></button>`]; 
    h = `<div class="card turn ${me}">
      ${left > 0 ? `<div class="tpw" style="animation-delay:${Math.max(0,left-300)}ms"><div class="tp">PÁSKA</div><div class="tp">PÁSKA</div><div class="tp">PÁSKA</div></div>` : ""}
      ${fx.parrot ? `<div class="pb">🦜 Poradím ti: ${room.rn % 2 ? "Pravda" : "Lež"}!</div>` : ""}
      <div class="q">${fx.dizzy ? scramble(q.t) : esc(q.t)}</div>
      <div class="ab">${done ? `<p class="pill">Odpověď odeslána. ${n3 ? "Odpověděli " + Object.keys(room.ans || {}).length + " z " + CAP + "." : room.ans?.[o] ? "Soupeř už odpověděl." : "Čekám na soupeře…"}</p>` : `<div class="grid2">${b.join("")}</div>`}
      ${fx.trojan ? `<div class="spy"><div>${SPY}<br><b>Trojský kůň zablokoval tvoje odpovědi</b></div></div>` : ""}
      </div></div>`;
  } else if(room.phase === "result"){
    h = `<div class="card"><div class="q">${esc(q.t)}</div><p class="pill">Další kolo začíná…</p></div>`;
  } else if(room.win === me && n3){
    tgtSel = null; h = pickHTML(me, me === "D");
  } else if(room.win === me){
    const lock = room.noG === me;
    h = `<div class="card turn ${me}"><strong>Byl jsi nejrychlejší. Vyber si odměnu:</strong><div class="opts">
      <button class="main opt" data-act="rw" data-k="step"><b>${me === "A" ? "Postoupit o 1 pole" : "Odhodit útočníka o 1 pole"}</b></button>` +
      (() => { if(room.gd === false) return ""; const k = offer(me), g = GD[k], ic = g.i || SPY.replace(' class="sp"', "").replace('width="170"', 'width="64"');
        return `<button class="opt" data-act="rw" data-k="${k}" ${lock ? "disabled" : ""}><span class="ic">${ic}</span><span><b>${g.n}</b><br><small>${g.d}</small></span></button>`; })() +
      `</div>${lock ? '<p class="pill">Po katapultu nemůžeš v tomto kole použít vylepšovák.</p>' : ""}</div>`;
  } else h = `<div class="card"><p class="pill">${n3 ? esc(nm(room.win)) : roleName(room.win)} vybírá odměnu…</p></div>`;
  $("#strip").innerHTML = room.phase === "answer" ? rolesOf(room.mode).map(r => { const pl = Object.values(room.players).find(p => p.role === r); if(!pl) return ""; const dn = !!room.ans?.[r];
    return `<div class="st${dn ? " ok" : ""}" style="--c:${r === "D" ? "var(--def)" : (ACOL[r] || "var(--atk)")}">${avatarHTML(pl.av, pl.name, 28, pl.fr)}<span>${esc(pl.name)}</span><i>${dn ? ic("check", 14) : ""}</i></div>`; }).join("") : "";
  $("#panel").innerHTML = h;
}

/* ---------- Události ---------- */
document.addEventListener("click", async e => {
  if(!e.target.closest(".dd")) document.querySelectorAll(".dd.open").forEach(d => d.classList.remove("open"));
  if(!e.target.closest("#snd")) { const sn = $("#snd"); if(sn) sn.classList.remove("open"); }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(NAV.test(a)){ navTok++; fresh(); }
  if(a === "menu") menu();
  else if(a === "find") find();
  else if(a === "create") create();
  else if(a === "login") login();
  else if(a === "account") account();
  else if(a === "admin") admin();
  else if(a === "adtab") admin(b.dataset.v);
  else if(a === "helperq") helperQ();
  else if(a === "help") helpScreen();
  else if(a === "hptab") helpScreen(b.dataset.v);
  else if(a === "actab") account(b.dataset.v);
  else if(a === "inbox") inboxScreen();
  else if(a === "contact") contact();
  else if(a === "sendrep") sendReport();
  else if(a === "buync") buyNc();
  else if(a === "savecol") saveCol();
  else if(a === "pickcol"){ shopCol = b.dataset.v; document.querySelectorAll(".swb").forEach(x => x.classList.toggle("on", x.dataset.v === shopCol)); const pv = $(".prev b"); if(pv) pv.innerHTML = nmC(U.name, shopCol); }
  else if(a === "ddt"){ const d = b.closest(".dd"), o = d.classList.contains("open"); document.querySelectorAll(".dd.open").forEach(x => x.classList.remove("open")); if(!o) d.classList.add("open"); }
  else if(a === "ddo"){ const d = b.closest(".dd"), id = d.dataset.dd; cfg[id] = b.dataset.v; d.outerHTML = ddHTML(id); }
  else if(a === "chp"){ const g = b.closest(".chips"); cfg[g.dataset.ch] = b.dataset.v; g.querySelectorAll(".chp").forEach(x => x.classList.toggle("on", x === b)); }
  else if(a === "adv"){ b.classList.toggle("open"); $("#adv").classList.toggle("open"); }
  else if(a === "reply"){ const c = b.closest("[data-r]"), t = c.querySelector(".rt").value.trim(); if(!t) return toast("Napiš odpověď");
    const title = c.querySelector("strong").textContent;
    push(ref(db, "inbox/" + c.dataset.u), {title:"Odpověď: " + title, text:t, ts:Date.now(), read:false})
      .then(() => update(ref(db, "reports/" + c.dataset.r), {reply:t, repTs:Date.now()})).then(() => toast("Odpověď odeslána")).catch(() => toast("Nepovedlo se odeslat")); }
  else if(a === "delrep"){ if(confirm("Smazat toto hlášení?")) remove(ref(db, "reports/" + b.closest("[data-r]").dataset.r)); }
  else if(a === "dologin") doLogin();
  else if(a === "doreg") doReg();
  else if(a === "logout"){ goMenu = true; signOut(auth); }
  else if(a === "theme"){ S.theme = S.theme === "dark" ? "light" : "dark"; save(); applyTheme(); }
  else if(a === "addq"){ const t = $("#qt").value.trim(); if(!t) return toast("Napiš tvrzení");
    push(ref(db, "questions"), {t, a:$("#qa").value === "1", e:$("#qe").value.trim()}).then(() => { $("#qt").value = ""; $("#qe").value = ""; toast("Otázka přidána"); }).catch(() => toast("Nepovedlo se, zkontroluj pravidla databáze")); }
  else if(a === "delq") remove(ref(db, "questions/" + b.dataset.id));
  else if(a === "padd" || a === "psub"){ const row = b.closest("[data-u]"), n = Math.abs(parseInt(row.querySelector(".pi").value) || 0) * (a === "psub" ? -1 : 1);
    runTransaction(ref(db, "users/" + row.dataset.u + "/points"), v => Math.max(0, (v || 0) + n)); }
  else if(a === "settag"){ const row = b.closest("[data-u]"); update(ref(db, "users/" + row.dataset.u), {tag:row.querySelector(".ti").value.trim() || null}); }
  else if(a === "deluser"){ if(confirm("Opravdu smazat tento účet?")) remove(ref(db, "users/" + b.closest("[data-u]").dataset.u)); }
  else if(a === "mok"){ const n = $("#mn").value.trim(); if(!n) return toast("Napiš přezdívku"); closeModal(n); }
  else if(a === "mcancel") closeModal(null);
  else if(a === "join"){ const n = await askName(); if(n) joinRoom(b.dataset.code, n); }
  else if(a === "joincode"){ const c = $("#jc").value.trim(); if(c.length < 4) return toast("Kód má 4 písmena"); const n = await askName(); if(n) joinRoom(c, n); }
  else if(a === "docreate"){ const rn = $("#rn").value.trim(); const n = await askName(); if(n) createRoom(n, rn, cfg.pub === "1", cfg.mode, {ms:+cfg.ms, mr:+cfg.mr, gd:cfg.gd === "1"}); }
  else if(a === "swap") swapRoles();
  else if(a === "start") startGame();
  else if(a === "ans") answer(b.dataset.v === "1");
  else if(a === "rw") reward(b.dataset.k, myRole());
  else if(a === "rw3") reward(b.dataset.k, myRole(), b.dataset.t || tgtSel);
  else if(a === "seltgt"){ tgtSel = b.dataset.t; document.querySelectorAll(".tgb").forEach(x => x.classList.toggle("on", x === b)); }
  else if(a === "takedef") takeDef();
  else if(a === "setrole") setRole(b.dataset.id, b.dataset.r);
  else if(a === "buyit") buyIt(b.dataset.k);
  else if(a === "pickfr"){ shopFr = b.dataset.v; document.querySelectorAll(".frb").forEach(x => x.classList.toggle("on", x === b)); const pv = $(".frprev"); if(pv) pv.innerHTML = avatarHTML(U.avatar, U.name, 96, shopFr); }
  else if(a === "savefr") saveFr();
  else if(a === "fgp"){ const g = b.dataset.g; fgEdit[g] = g === "c" ? (b.dataset.v || null) : b.dataset.v; b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); const pv = $("#fgprev"); if(pv) pv.innerHTML = fgPrev(); }
  else if(a === "savefg") saveFg();
  else if(a === "sndt"){ const sn = $("#snd"); sn.classList.toggle("open"); }
  else if(a === "stn") setStn(b.dataset.v);
  else if(a === "sndmute"){ SND.muted = !SND.muted; S.muted = SND.muted; save(); sndVol(); sndUI(); }
  else if(a === "sndnext") sndNext();
  else if(a === "addsong") addSong();
  else if(a === "delsong") update(ref(db), {["music/" + b.dataset.id]:null, ["musicData/" + b.dataset.id]:null});
  else if(a === "kick"){ const id = b.dataset.id; if(room && room.host === S.id && id !== S.id) update(R(), {[`players/${id}`]:null, [`kicked/${id}`]:true}).then(() => toast("Hráč byl vyhozen")); }
  else if(a === "copycode"){ navigator.clipboard?.writeText(code).then(() => toast("Kód zkopírován")).catch(() => toast("Kód hry: " + code)); }
  else if(a === "leave") leave();
});
document.addEventListener("change", e => { if(e.target.id === "avf") uploadAvatar(e.target.files[0]); });
document.addEventListener("keydown", e => { if(e.key === "Enter" && $("#mn")) $('[data-act="mok"]').click(); else if(e.key === "Enter" && $("#lp")) $('[data-act="dologin"]').click(); });

sndMount();
setTimeout(() => { if(goMenu){ goMenu = false; menu(); } }, 2500);
</script>
</body>
</html>
